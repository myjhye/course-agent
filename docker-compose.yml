services:
  facility-mcp:
    build:
      context: ./mcp_servers/facility_server
      dockerfile: Dockerfile
    container_name: course-agent-facility-mcp
    env_file:
      - ./mcp_servers/facility_server/.env
    expose:
      - "8001"
    restart: unless-stopped

  course-agent:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: course-agent-api
    env_file:
      - ./server/.env
    environment:
      FACILITY_MCP_URL: http://facility-mcp:8001/mcp
    ports:
      - "8000:8000"
    depends_on:
      - facility-mcp
    restart: unless-stopped

